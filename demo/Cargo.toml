[package]
name = "turbo-ferret-demo"
description = "Turbo Ferret demo (a Rust port of Turbo Badger's demo01). Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "turbo-ferret-demo"
path = "src/main.rs"

[dependencies]
turbo-ferret = { path = "../crates/turbo-ferret", features = ["debug"] }
turbo-ferret-ttf = { path = "../crates/turbo-ferret-ttf" }
turbo-ferret-soft = { path = "../crates/turbo-ferret-soft" }
turbo-ferret-miniquad = { path = "../crates/turbo-ferret-miniquad" }
miniquad = "0.4.11"

[dev-dependencies]
png = "0.17"
